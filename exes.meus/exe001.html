<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus testes</title>
</head>
<body>
    <script>
       var nome = prompt('Digite seu nome: ') // Aqui estou pedindo o nome da pessoa! 

       if (nome === "Rafaella"){ //Aqui criei um if pra que so mostre essa mensagem para um nome especifico que for digitado
            prompt(`Oi ${nome}!` );
       }
       else{
            prompt("Quem é você?");// se não for o nome correto, pedi para o usuario se identificar
       }
    </script>
</body>
</html>
